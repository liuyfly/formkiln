name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC) and provenance.
  id-token: write

jobs:
  release:
    # Disabled until npm trusted publishing is configured for every package.
    # Enable by setting the repository variable NPM_RELEASE_ENABLED=true.
    if: vars.NPM_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Opens a "Version Packages" PR when changesets exist; publishes to npm when that PR is merged.
      # No npm token is stored: publishing relies on trusted publishing configured per package on npmjs.com.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
